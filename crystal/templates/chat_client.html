<!DOCTYPE html>
<html>
<head>
    <title>Chat - Crystal Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">Crystal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="/shell">Shell</a></li>
                <li class="nav-item"><a class="nav-link" href="/logs">Logs</a></li>
                <li class="nav-item"><a class="nav-link" href="/generate-payload">Generate Payload</a></li>
                <li class="nav-item"><a class="nav-link" href="/listener">Listener</a></li>
                <li class="nav-item"><a class="nav-link" href="/chat">Chat</a></li>
                <li class="nav-item"><a class="nav-link" href="/files">File Browser</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h1 class="mt-5">Chat</h1>
        <div id="chat-box" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll;"></div>
        <input type="text" id="message-input" class="form-control" placeholder="Type your message...">
        <button id="send-button" class="btn btn-primary">Send</button>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const socket = new WebSocket('ws://localhost:8765');

        socket.onmessage = function(event) {
            const message = document.createElement('p');
            message.textContent = event.data;
            chatBox.appendChild(message);
        };

        sendButton.onclick = function() {
            const message = messageInput.value;
            socket.send(message);
            messageInput.value = '';
        };
    </script>
</body>
</html>
