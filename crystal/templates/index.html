<!DOCTYPE html>
<html>
<head>
    <title>Crystal Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">Crystal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="/shell">Shell</a></li>
                <li class="nav-item"><a class="nav-link" href="/logs">Logs</a></li>
                <li class="nav-item"><a class="nav-link" href="/generate-payload">Generate Payload</a></li>
                <li class="nav-item"><a class="nav-link" href="/listener">Listener</a></li>
                <li class="nav-item"><a class="nav-link" href="/chat">Chat</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h1 class="mt-5">Crystal Dashboard</h1>
        <p>Welcome to the Crystal Red Teaming Framework.</p>
        <canvas id="myChart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctx = document.getElementById('myChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
                datasets: [{
                    label: '# of Votes',
                    data: [12, 19, 3, 5, 2, 3],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
